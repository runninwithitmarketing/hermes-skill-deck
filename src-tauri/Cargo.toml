[package]
name = "hermes-skill-deck"
version = "0.1.2"
description = "Hermes Skill Deck desktop app"
authors = ["Jason Pollak"]
edition = "2021"

[lib]
name = "hermes_skill_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
